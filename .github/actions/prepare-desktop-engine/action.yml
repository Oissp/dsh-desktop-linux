name: Prepare desktop engine
description: Restore, build, and save the cached dsh engine and Electron runtime for linux-x64.

# 缓存 key 只哈希已跟踪源码：git ls-files 排序输出，且天然排除 pnpm install 与 prepare:*
# 写入的 node_modules、构建产物，所以同一次 run 的 restore 与 save 才会算出同一个 key。
# 依赖变化由 pnpm-lock.yaml 捕获。
#
# pathspec 必须覆盖每一份随 dsh/ 进包的源码，否则该处的改动不会让缓存失效，
# --builder-only 会复用旧产物。apps/cli 即 @deepseek-ai/dsh，apps/web 是被
# dsh-web-app 依赖的 @deepseek-ai/dsh-web-frontend，两者都不是壳代码。
#
# apps/desktop/package.json 也在 pathspec 内：prepare 既把壳版本写进
# runtime/primary-runtime/runtime.json 的 desktopVersion，又是唯一构建壳自身
# workspace 依赖 lib/ 的步骤，而 electron-builder 会把那些 lib/ 打进 app.asar。
# 版本 bump 命中缓存就会跳过该步骤，产物缺少 node_modules/@deepseek-ai/*/lib，
# 主进程 import 直接失败、窗口不出现（0.1.7-rc.1.2 即为此）。
#
# 测试文件不进入产物：库编译只取各包的 src 与入口 bundle，release:pack 的 files 字段也不含
# 测试。因此 key 排除 **/*.spec.ts、**/*.spec.tsx 与 **/tests/**，改测试（含 scripts/** 下的
# spec）仍能命中缓存。代价是：仅改测试的提交命中缓存时不会顺带执行 build:official 的聚合检查，
# 测试文件的类型错误改由 typecheck 门禁发现。
#
# 输入不止源码：prepare-runtime 把 apps/desktop/cli/dsh 拷进被缓存的 runtime/cli/bin/，
# tsc 按 apps/desktop/tsconfig.{host,client}.json 产出被缓存的 lib/，本 action 自己定义
# 缓存路径与 prepare 命令。三者都在 pathspec 内，因此改它们（含本文件的注释）会让缓存失效。
#
# 下载缓存与引擎缓存分开：Electron、Node、Python、pnpm 与 wheel 归档只随依赖锁变化，
# 不随源码变化。使用独立的精确 key（pnpm-lock.yaml + primary-runtime/lock.json），源码
# 改动导致引擎 key 失效时仍可复用下载缓存，避免重复下载数百 MB。该缓存只保存归档文件，
# 不包含任何构建产物；PR 只恢复，push 才写入。缓存写入是性能优化，并发 run 写同一
# 内容 key 时允许一份失败而不使打包/发版 job 失败。
#
# 缓存路径必须覆盖 package-target.ts --builder-only 断言的每一份产物：壳 bundle、
# Electron 运行时、dsh 运行时清单，以及 apps/desktop 生产依赖闭包里每个 workspace 包的
# lib/（electron-builder 会把它们整体打进 app.asar/node_modules）。闭包不是只看 main.js 的
# 裸导入：@deepseek-ai/cordis 等包在运行时再 import 自己的 workspace 依赖（cosmokit、
# schemastery、dsh-deque、dsh-timeout、dsh-typert-protocol、dsh-brand），少缓存一份，
# 命中缓存的产物就在主进程加载时 ERR_MODULE_NOT_FOUND，窗口不出现（0.2.2-alpha.3 即为此：
# alpha.3 发版 run 命中了同 key 的引擎缓存）。--builder-only 按同一闭包校验，缺任一份即失败。
# 即使是非源码的 apps/desktop 改动（如文档）命中缓存，也是同一份依赖链，故这些 lib 一并缓存。

runs:
  using: composite
  steps:
    - name: Compute engine cache key
      id: engine-key
      shell: bash
      run: |
        KEY=$(git ls-files -- \
          package.json pnpm-lock.yaml pnpm-workspace.yaml \
          'tsconfig*.json' 'scripts/**' 'packages/**' 'vendor/**' 'native/**' \
          'apps/cli/**' 'apps/web/**' 'apps/desktop-host/**' \
          'apps/desktop/package.json' \
          'apps/desktop/src/**' 'apps/desktop/renderer/**' \
          'apps/desktop/scripts/**' apps/desktop/electron-builder.config.mjs \
          apps/desktop/tsdown.config.ts 'apps/desktop/tsconfig*.json' \
          'apps/desktop/cli/**' '.github/actions/prepare-desktop-engine/**' \
          ':(exclude)**/*.spec.ts' ':(exclude)**/*.spec.tsx' ':(exclude)**/tests/**' \
          | git hash-object --stdin-paths \
          | git hash-object --stdin)
        echo "key=${{ runner.os }}-dsh-engine-$KEY" >> "$GITHUB_OUTPUT"

    - name: Restore runtime download cache
      id: downloads-cache
      uses: actions/cache/restore@v6
      with:
        path: apps/desktop/.desktop-build/downloads
        key: ${{ runner.os }}-dsh-downloads-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/lock.json') }}

    - name: Restore engine build cache
      id: engine-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          apps/desktop/lib
          apps/desktop/.desktop-build/targets/linux-x64/electron
          apps/desktop/.desktop-build/targets/linux-x64/runtime
          apps/desktop/.desktop-build/targets/linux-x64/dsh
          vendor/cordis/lib
          vendor/cosmokit/lib
          vendor/schemastery/lib
          packages/api/gateway/lib
          packages/util/brand/lib
          packages/util/deque/lib
          packages/util/timeout/lib
          packages/typert/protocol/lib
        key: ${{ steps.engine-key.outputs.key }}

    - name: Prepare engine + runtime (linux x64)
      if: steps.engine-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm run prepare:desktop:linux:x64

    - name: Save runtime download cache
      if: steps.downloads-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
      # Cache writes are performance-only; a concurrent run may already own this key.
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: apps/desktop/.desktop-build/downloads
        key: ${{ runner.os }}-dsh-downloads-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/lock.json') }}

    # Save only from a push build. Branches share one cache namespace but the same key
    # lives independently per ref, so a pull-request build that saved its own copy could
    # never hit the push build's entry — it only multiplied the 331 MB copy. PR builds
    # restore from the main ref and never write, which also removes the save race two
    # workflows on one push used to lose ("another job may be creating this cache").
    - name: Save engine build cache
      if: steps.engine-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
      # Cache writes are performance-only; a concurrent run may already own this key.
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: |
          apps/desktop/lib
          apps/desktop/.desktop-build/targets/linux-x64/electron
          apps/desktop/.desktop-build/targets/linux-x64/runtime
          apps/desktop/.desktop-build/targets/linux-x64/dsh
          vendor/cordis/lib
          vendor/cosmokit/lib
          vendor/schemastery/lib
          packages/api/gateway/lib
          packages/util/brand/lib
          packages/util/deque/lib
          packages/util/timeout/lib
          packages/typert/protocol/lib
        key: ${{ steps.engine-key.outputs.key }}
