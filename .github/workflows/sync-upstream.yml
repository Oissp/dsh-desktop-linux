name: Sync upstream deepseek-harness

# 跟随官方上游：把 deepseek-ai/deepseek-harness master 合并进本分支。
# 仅当上游根 package.json 版本语义化严格大于当前版本时合并并推送（保持发版节奏与官方对齐，
# 避免把上游未发版的中间提交/回退批量带入）；需要手动跟随非版本变更时可用 force 强制合并。
# 合并冲突分两类（清单见 .github/sync-trimmed-paths.txt）：
#   - 清单内（fork 有意裁剪的上游文件）：自动按「保留裁剪」解决，合并后还会删除上游
#     重新带回/新增的清单内文件，全程无需人工；
#   - 清单外：中止合并并开 issue 通知人工处理。
#
# 推送 main 会自然触发 package-deb.yml（push + paths: package.json）→ 版本变更即打包发版。

on:
  schedule:
    # 每日 UTC 06:00（= 北京时间 14:00）；GitHub cron 不保证准点，但会执行。
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制合并上游（即使版本未严格升级）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 推送合并结果
  issues: write     # 合并冲突时开 issue

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream master
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master

      - name: Compare root versions (semver strict upgrade)
        id: compare
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          TARGET=$(git show "upstream/master:package.json" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d.version)")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          FORCE="${{ inputs.force }}"
          echo "当前版本: $CURRENT"
          echo "上游版本: $TARGET"
          if [ "$FORCE" = "true" ]; then
            echo "::notice::强制模式，跳过版本比较"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" = "$TARGET" ]; then
            echo "版本相同，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # semver 比较移到 scripts/compare-dsh-versions.mjs（可单测）：
            #   0 = target 严格大于 current（同步）；2 = 不大于（跳过）；其他 = 出错。
            # 显式捕获退出码，避免依赖 if/elif 条件退出状态——node 脚本崩溃（如比较器
            # 语法错误）会走到 else 静默当成"无变更"，比较失败必须报错中止。
            set +e
            node scripts/compare-dsh-versions.mjs "$TARGET" "$CURRENT"
            CMP=$?
            set -e
            if [ "$CMP" -eq 0 ]; then
              echo "检测到上游新版本（semver 严格大于）：$CURRENT → $TARGET"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif [ "$CMP" -eq 2 ]; then
              echo "上游版本不更新（target 更老），跳过"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::版本比较失败（exit=$CMP）：current=$CURRENT, target=$TARGET"
              exit 1
            fi
          fi

      - name: Merge upstream master
        id: merge
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          UPSTREAM_HEAD=$(git rev-parse --short upstream/master)
          echo "上游 HEAD: $UPSTREAM_HEAD"
          echo "合并 ${{ steps.compare.outputs.target }} (upstream/master @ $UPSTREAM_HEAD) → 当前分支"

          MERGE_OK=true
          git merge upstream/master --no-edit || MERGE_OK=false

          TRIM_LIST=.github/sync-trimmed-paths.txt
          # 冲突落在裁剪清单内 → 保留 fork 裁剪结果：fork 侧存在该文件则取 ours，
          # fork 侧已删除则 git rm（上游改动/上游新增对已删文件的 modify/delete 冲突）。
          resolve_trimmed() {
            if git cat-file -e "HEAD:$1" 2>/dev/null; then
              git checkout --ours -- "$1" && git add -- "$1"
            else
              git rm -q -- "$1"
            fi
          }

          UNRESOLVED=""
          if [ "$MERGE_OK" = "false" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if grep -v '^#' "$TRIM_LIST" | grep -Fxq -- "$file"; then
                echo "冲突在裁剪清单内，保留裁剪: $file"
                resolve_trimmed "$file"
              else
                UNRESOLVED="$UNRESOLVED$file"$'\n'
              fi
            done < <(git diff --name-only --diff-filter=U)
          fi

          if [ -n "$UNRESOLVED" ]; then
            echo "::error::与上游存在裁剪清单外的合并冲突"
            echo "冲突文件:"
            printf '%s' "$UNRESOLVED"
            BODY_FILE="$RUNNER_TEMP/sync-conflict-body.md"
            {
              echo "上游同步失败：${{ steps.compare.outputs.target }} 与当前分支存在合并冲突。"
              echo ""
              echo "裁剪清单内的冲突已自动按「保留裁剪」解决，以下为需要人工判断的冲突文件："
              echo '```'
              printf '%s' "$UNRESOLVED"
              echo '```'
              echo ""
              echo "需要人工解决：保留 linux 裁剪结果，或按需接受上游改动。解决后可在 Actions 手动重跑本 workflow（force=true）。"
            } > "$BODY_FILE"
            git merge --abort
            gh issue create \
              --title "上游同步冲突: deepseek-harness ${{ steps.compare.outputs.target }} → $(date +%F)" \
              --body-file "$BODY_FILE" \
              --repo "${{ github.repository }}" \
              || echo "::warning::开 issue 失败"
            exit 1
          fi

          # 合并后强制裁剪：上游恢复或新增清单内文件时合并不冲突，会直接进入代码树，
          # 必须在合并提交落盘前移除。干净合并时把删除折入合并提交（amend 保留双亲）。
          TRIMMED=""
          for file in $(grep -v '^#' "$TRIM_LIST"); do
            if [ -e "$file" ]; then
              git rm -rq -- "$file"
              TRIMMED="$TRIMMED $file"
            fi
          done

          if [ "$MERGE_OK" = "false" ] || [ -n "$TRIMMED" ]; then
            if [ "$MERGE_OK" = "true" ]; then
              git commit --amend --no-edit
            else
              git commit --no-edit
            fi
          fi

          echo "merge_ok=true" >> "$GITHUB_OUTPUT"
          echo "合并成功，推送 main"
          git push origin main
          {
            echo "## 上游同步完成"
            echo "- 上游版本: \`${{ steps.compare.outputs.target }}\`"
            echo "- 上游 HEAD: \`$UPSTREAM_HEAD\`"
            echo "- 变更文件: \`$(git diff --name-only HEAD~1 HEAD | wc -l | tr -d ' ')\`"
            if [ -n "$TRIMMED" ]; then
              echo "- 按裁剪清单移除: \`$TRIMMED\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skipped (no upstream change)
        if: steps.compare.outputs.changed != 'true'
        run: echo "上游无新版本，本次不合并"
