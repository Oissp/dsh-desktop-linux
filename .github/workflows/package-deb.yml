name: Package (Debian deb + AppImage)

# Linux x64 打包发版：构建 .deb 安装包 + AppImage（electron-updater 更新负载）+ 频道元数据，
# 上传产物并把 GitHub Release（tag = v<desktop package.json version>）发到独立发布仓库
# Oissp/dsh-desktop-linux-release（需要 RELEASE_TOKEN secret，一个拥有 repo 权限的 PAT）。
# 桌面版本跟随内置 dsh 引擎版本（可带 .N 构建后缀，如 0.1.5-rc.2.1），所以版本号
# 取 apps/desktop/package.json，而不是根 package.json（引擎版本）。
# 自动更新频道（app-update.yml 里 provider=github，指向同一发布仓库）由 electron-updater 从
# 各 release 的 <channel>-linux.yml + 安装资产拉取。
# 源码与发布分离：本仓库（fork）保留上游 tag/历史用于跟随官方，.deb/AppImage 资产进专用仓库。
#
# 触发：
#   - push 到 main 且 package.json 或 apps/desktop/** 变更（壳功能/构建号 bump / 上游同步）→ 发版
#   - 手动 workflow_dispatch（可强制重建当前版本）
#
# 幂等：发布仓库中 v<version> release 已存在则跳过发布，避免重复发版。
# 并发：同一 ref 同时只允许一个打包 run，且不取消进行中的——避免产物被中途杀掉导致残缺。
# 引擎缓存：build:official + release:pack + prepare:* 的产物只依赖引擎源码（不含壳版本号），
# 纯 .N 版本 bump 完全不变。把它们缓存起来（key 用 git 只哈希已跟踪源码、排除
# apps/desktop/package.json），命中时用 package-target.ts --builder-only 跳过准备、直接跑 electron-builder。

on:
  push:
    branches: [main]
    paths: ['package.json', 'apps/desktop/**']
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建当前版本（即使 v<version> release 已存在）'
        required: false
        type: boolean
        default: false

# 全程只用 GITHUB_TOKEN 做只读操作（checkout、artifact 上传/下载）；跨仓库发布走
# RELEASE_TOKEN PAT，因此 workflow 级别 contents: read 即可，不授予 write。
permissions:
  contents: read

concurrency:
  group: package-deb-${{ github.ref }}
  cancel-in-progress: false

env:
  # 打包必需的反向 DNS 应用 ID。可在仓库 Secret 覆盖（DSH_DESKTOP_APP_ID）。
  DSH_DESKTOP_APP_ID: ${{ secrets.DSH_DESKTOP_APP_ID || 'com.deepseek.harness.desktop' }}
  PNPM_NODE_LINKER: hoisted

jobs:
  package:
    name: Build .deb + AppImage (linux x64)
    # 固定 24.04：ubuntu-latest 将自 2026-10-19 起迁移到 Ubuntu 26（runner-images#14748），
    # 打包宿主的 apt 依赖集与 electron-builder 行为先在受控版本上验证，再手动跟进升级。
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache electron & electron-builder binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-eb-${{ hashFiles('apps/desktop/electron-builder.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-eb-

      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04 将 libasound2 改名为 libasound2t64；按镜像可用性取其一。
          (sudo apt-get install -y --no-install-recommends libasound2t64 || \
           sudo apt-get install -y --no-install-recommends libasound2) >/dev/null 2>&1 || { echo "::error::libasound 安装失败"; exit 1; }
          sudo apt-get install -y --no-install-recommends \
            python3 make g++ fakeroot xz-utils file \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libgtk-3-0 \
            xvfb xauth

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version
        # 桌面 release 版本 = apps/desktop 版本（跟随引擎版本，可带 .N 构建后缀）；
        # electron-builder 产物名也用同一版本，保证 tag / 产物 / 自动更新一致。
        id: version
        run: echo "version=$(node -e "console.log(require('./apps/desktop/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Run desktop packaging tests
        run: pnpm exec vitest run apps/desktop/tests

      - name: Prepare engine + runtime (cached)
        uses: ./.github/actions/prepare-desktop-engine

      - name: Package .deb + AppImage (linux x64)
        run: |
          # electron-builder 打包时会读到环境里的 GITHUB_TOKEN；为避免其被写进 app-update.yml，
          # 本步骤只做 --publish never 本地打包（不需要 token），运行时走公开 GitHub Releases
          # 也不需要凭据，因此先摘掉它。缓存命中时直接用 --builder-only 跳过引擎准备。
          unset GITHUB_TOKEN
          pnpm run package:desktop:linux:x64:builder

      - name: Verify artifacts
        run: |
          ART=apps/desktop/.desktop-build/targets/linux-x64/artifacts
          VERSION="${{ steps.version.outputs.version }}"
          DEB="$ART/deepseek-harness-$VERSION-linux-x64.deb"
          APPIMAGE="$ART/deepseek-harness-$VERSION-linux-x64.AppImage"
          test -f "$DEB" || { echo "::error::缺少 .deb 产物: $DEB"; exit 1; }
          test -f "$APPIMAGE" || { echo "::error::缺少 AppImage 产物: $APPIMAGE"; exit 1; }
          # electron-updater 按 electron-builder 的默认频道名拉取元数据；缺失或改名会让
          # 已安装的客户端永远查不到更新，所以这里按文件名硬断言。
          test -f "$ART/latest-linux.yml" || { echo "::error::缺少自动更新频道元数据: $ART/latest-linux.yml"; exit 1; }
          ls -lh "$ART/"
          echo "--- deb control ---"
          dpkg-deb -I "$DEB" | head -30
          echo "--- app-update.yml (自动更新源) ---"
          UPDATE_YML="$ART/linux-unpacked/resources/app-update.yml"
          test -f "$UPDATE_YML" || { echo "::error::缺少 app-update.yml: $UPDATE_YML"; exit 1; }
          cat "$UPDATE_YML"
          grep -q 'provider: github' "$UPDATE_YML" || { echo "::error::app-update.yml 缺少 provider=github"; exit 1; }
          grep -q 'dsh-desktop-linux-release' "$UPDATE_YML" || { echo "::error::app-update.yml 未指向 Oissp/dsh-desktop-linux-release"; exit 1; }
          if grep -qiE 'token|ghp_|github_pat_' "$UPDATE_YML"; then
            echo "::error::app-update.yml 疑似包含 GitHub token，禁止发布"
            exit 1
          fi
          echo "--- 图标资源（外观切换四件套） ---"
          for f in icon-dark.png tray-dark.png icon-white.png tray-white.png; do
            test -f "$ART/linux-unpacked/resources/$f" || { echo "::error::缺少运行时图标 resources/$f"; exit 1; }
          done
          echo "--- 桌面启动项（窗口关联身份） ---"
          # 桌面环境用窗口的 WM_CLASS/app_id 匹配启动项的 StartupWMClass。两边必须取同一个
          # 反向 DNS 身份（appId 去掉 .desktop 后缀），否则运行中的窗口不会被归到启动项下。
          APP_ID="${DSH_DESKTOP_APP_ID}"
          WM_CLASS="${APP_ID%.desktop}"
          DESKTOP_ENTRY="./usr/share/applications/${WM_CLASS}.desktop"
          dpkg-deb -c "$DEB" | grep -F "${DESKTOP_ENTRY#./}" >/dev/null \
            || { echo "::error::deb 中缺少启动项 ${DESKTOP_ENTRY#./}"; exit 1; }
          dpkg-deb --fsys-tarfile "$DEB" | tar -xO "$DESKTOP_ENTRY" > "$RUNNER_TEMP/desktop-entry"
          cat "$RUNNER_TEMP/desktop-entry"
          grep -qx "StartupWMClass=$WM_CLASS" "$RUNNER_TEMP/desktop-entry" \
            || { echo "::error::启动项的 StartupWMClass 与窗口身份 $WM_CLASS 不一致"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E "icons/hicolor|\.desktop" | head -12

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          # 频道元数据只取 electron-updater 真正拉取的 latest-linux.yml；同目录还有
          # electron-builder 的调试文件 builder-debug.yml，它不是发布资产。
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/latest-linux.yml
          # 制品只是 build → release 的中间传递载体，最终文件已进 GitHub Release。
          retention-days: 1

  release:
    name: Publish to dsh-desktop-linux-release
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_REPO: Oissp/dsh-desktop-linux-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::缺少 RELEASE_TOKEN secret（跨仓库发布需要）。请在 Settings → Secrets and variables → Actions 添加一个拥有 repo 权限的 PAT。"
            exit 1
          fi

      - name: Decide release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "::notice::强制重建模式，跳过已发布检查"
            SHOULD_RELEASE=true
          elif gh release view "v$VERSION" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "v$VERSION 已发布到 $RELEASE_REPO，跳过"
            SHOULD_RELEASE=false
          else
            echo "v$VERSION 未发布到 $RELEASE_REPO，继续"
            SHOULD_RELEASE=true
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "## 发版决策"
            echo "- 触发: \`${{ github.event_name }}\`"
            echo "- 版本: \`$VERSION\`"
            echo "- 发布仓库: \`$RELEASE_REPO\`"
            echo "- should_release: \`$SHOULD_RELEASE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          PREV_SHA=""
          # 本仓库的 tag 是上游引擎 tag（git describe 停在 dsh-v*），不是桌面发布的边界；
          # 桌面版本只在 apps/desktop/package.json。取最近一个版本号与当前不同的提交当上一版发布的
          # 边界，变更区间就是「上一版发布以来的提交」，不再每次重复全部历史。
          for c in $(git log --format=%H HEAD -- apps/desktop/package.json); do
            v=$(git show "$c:apps/desktop/package.json" 2>/dev/null | grep -m1 '^\s*"version"[[:space:]]*:' | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
            if [ -n "$v" ] && [ "$v" != "$VERSION" ]; then PREV_SHA=$c; PREV_VERSION=$v; break; fi
          done
          if [ -n "$PREV_SHA" ]; then
            LOG=$(git log --no-merges --pretty=format:"- %s" "$PREV_SHA"..HEAD)
            SCOPE="自 v$PREV_VERSION 以来"
          else
            LOG=$(git log --no-merges --pretty=format:"- %s" -50)
            SCOPE="最近 50 条提交"
          fi
          {
            echo "## DeepSeek Harness Desktop $VERSION (Linux x64)"
            echo ""
            echo "- **.deb** 安装包（Ubuntu / Debian）"
            echo "- **AppImage** 免安装可执行文件"
            echo ""
            echo "### 变更（$SCOPE）"
            echo "$LOG"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          PRERELEASE=()
          # 任何含 '-' 的版本号都是 semver 预发布（alpha/beta/rc/dev 等）。
          if [[ "$VERSION" == *-* ]]; then PRERELEASE+=(--prerelease); fi
          gh release create "v$VERSION" \
            --repo "$RELEASE_REPO" \
            --title "DeepSeek Harness Desktop $VERSION (Linux x64)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${PRERELEASE[@]}" \
            release-assets/*.deb release-assets/*.AppImage release-assets/latest-linux.yml
